services:
  printguard:
    # GPU inference (the -intel image with a /dev/dri device, or the -nvidia image) is set up in the README's
    # "Hardware acceleration" section; the CPU runtime needs nothing here.
    image: ghcr.io/oliverbravery/printguard:latest
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8554:8554"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # A camera plugged into this machine registers itself once you pass it in. List yours with
    # `ls /dev/v4l/by-id/`, and see "Cameras plugged into the hub" in docs/printers.md.
    # devices:
    #   - /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_A1B2C3-video-index0:/dev/nozzle-cam
