[project]
name = "printguard"
version = "2.5.1"
description = "Real-time 3D print failure detection"

license = "GPL-2.0-only"
requires-python = ">=3.12"
dependencies = [
    "ai-edge-litert>=2.1.5",
    "aiomqtt>=2.5.1",
    "av>=14.0",
    "fastapi>=0.136.3",
    "fastmcp>=3.4.2",
    "httpx>=0.28",
    "ml-dtypes>=0.5.1",
    "numpy>=2.1",
    "onnxruntime>=1.24.1; sys_platform != 'win32'",
    "onnxruntime-ep-openvino>=1.5.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime-windowsml>=1.24.1; sys_platform == 'win32'",
    "packaging>=24.0",
    "paho-mqtt>=2.1",
    "pycentauri>=0.7.0",
    "pydantic-settings>=2.14.2",
    "pyprusalink>=3.0",
    "pywin32>=312; sys_platform == 'win32'",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.49.0",
    "wasmtime>=47.0",
    "wasdk-Microsoft.Windows.AI.MachineLearning>=2.1.3; sys_platform == 'win32'",
    "wasdk-Microsoft.Windows.ApplicationModel.DynamicDependency.Bootstrap; sys_platform == 'win32'",
]

[project.scripts]
printguard = "printguard.server.app:main"
printguard-desktop = "printguard.server.desktop:main"

[project.optional-dependencies]
desktop = [
    "desktop-notifier>=6.1",
    "pillow>=10",
    "platformdirs>=4",
    "pystray>=0.19.5",
    "pywebview>=6.2",
]
nvidia = [
    "nvidia-cuda-runtime-cu12>=12.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime-ep-nv-tensorrt-rtx-cu12>=0.3.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["printguard"]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
onnxruntime-ep-nv-tensorrt-rtx-cu12 = { index = "nvidia" }
