<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-dtuQ7yKK0S3qxH4Q9/r9EdMvr7gUG23Ad1izvxcYJzo=' blob: 'unsafe-eval'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob: data:; font-src data:; connect-src 'none'; frame-src 'none'; child-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>PrintGuard plugin panel</title>
    <style>
      html,
      body {
        background: transparent;
        margin: 0;
      }
    </style>
    <script>
      (function () {
        "use strict";

        const closed = ["fetch", "fetchLater", "XMLHttpRequest", "WebSocket", "WebSocketStream", "WebTransport", "EventSource", "Worker", "SharedWorker", "indexedDB", "caches", "AudioContext", "webkitAudioContext", "speechSynthesis"];
        for (const name of [...closed, ...Object.getOwnPropertyNames(window).filter((name) => name.includes("RTC"))]) {
          try {
            delete window[name];
          } catch {
            /* frozen on some engines; the policy above is what actually closes all but WebRTC */
          }
        }

        const listeners = new Map();
        const assets = new Map();
        let effects = [];
        let store = {};
        let port = null;

        const flush = () => {
          if (effects.length) port.postMessage({ t: "effects", effects: effects.splice(0) });
        };

        const push = (effect) => {
          effects.push(effect);
          queueMicrotask(flush);
        };

        const pg = {
          state: {},
          theme: {},
          secrets: [],
          get store() {
            return store;
          },
          set store(value) {
            store = value;
            port.postMessage({ t: "store", store });
          },
          on(name, handler) {
            listeners.set(String(name), handler);
          },
          asset(name) {
            return assets.get(String(name)) ?? "";
          },
          command(cmd) {
            push({ kind: "command", cmd });
          },
          http(request) {
            push({ kind: "http", request });
          },
          socket(request) {
            push({ kind: "socket", action: "open", request });
          },
          socketSend(tag, text) {
            push({ kind: "socket", action: "send", request: { tag, text: String(text) } });
          },
          socketClose(tag) {
            push({ kind: "socket", action: "close", request: { tag } });
          },
          call(request) {
            push({ kind: "link", action: "call", request });
          },
          publish(request) {
            push({ kind: "link", action: "publish", request });
          },
          notify(text) {
            push({ kind: "notify", text: String(text) });
          },
          sound(sound) {
            push(typeof sound === "string" ? { kind: "sound", asset: sound } : { kind: "sound", tones: Array.isArray(sound) ? sound : [sound] });
          },
          background(image) {
            push({ kind: "background", image: String(image) });
          },
          log(text) {
            push({ kind: "log", text: String(text) });
          },
        };
        window.pg = pg;

        function silenceMedia() {
          const policy = document.createElement("meta");
          policy.httpEquiv = "Content-Security-Policy";
          policy.content = "media-src 'none'";
          document.head.appendChild(policy);
        }

        const SCRIPT_TYPES = ["", "module", "text/javascript", "application/javascript"];

        function paint(html) {
          const range = document.createRange();
          range.selectNodeContents(document.body);
          const fragment = range.createContextualFragment(html);
          const loaded = [];
          for (const script of fragment.querySelectorAll("script")) {
            if (script.hasAttribute("src") || !SCRIPT_TYPES.includes(script.type)) continue;
            const blobScript = document.createElement("script");
            blobScript.type = script.type;
            blobScript.async = false;
            blobScript.src = URL.createObjectURL(new Blob([script.textContent], { type: "text/javascript" }));
            loaded.push(new Promise((resolve) => (blobScript.onload = blobScript.onerror = resolve)));
            script.replaceWith(blobScript);
          }
          document.body.append(fragment);
          return Promise.all(loaded);
        }

        let themed = null;

        function applyTheme(tokens) {
          if (!tokens || !Object.keys(tokens).length) return;
          pg.theme = tokens;
          if (!themed) {
            themed = document.createElement("style");
            document.head.insertBefore(themed, document.head.firstChild);
          }
          const vars = Object.entries(tokens).map(([k, v]) => `${k}:${v}`).join(";");
          themed.textContent = `:root{${vars};color-scheme:${tokens["color-scheme"] || "dark"}}`;
        }

        function reportHeight() {
          let last = 0;
          new ResizeObserver(() => {
            const height = Math.ceil(document.documentElement.scrollHeight);
            if (height === last) return;
            last = height;
            port.postMessage({ t: "size", height });
          }).observe(document.documentElement);
        }

        async function receive(message) {
          const data = message.data || {};
          try {
            if (data.t === "init") {
              store = data.store || {};
              pg.state = data.state || {};
              pg.secrets = data.secrets || [];
              applyTheme(data.theme);
              if (!data.sound) silenceMedia();
              for (const [name, blob] of Object.entries(data.assets || {})) assets.set(name, URL.createObjectURL(blob));
              await paint(String(data.html || ""));
              reportHeight();
              listeners.get("ready")?.(pg.state);
            } else if (data.t === "state") {
              pg.state = data.state || {};
              pg.secrets = data.secrets || [];
              applyTheme(data.theme);
              listeners.get("state")?.(pg.state);
            } else if (data.t === "event") {
              listeners.get(String(data.event.event))?.(data.event);
            }
          } catch (err) {
            port.postMessage({ t: "failed", message: String((err && err.message) || err) });
          }
        }

        addEventListener("message", (handover) => {
          if (handover.source !== parent || port || !handover.ports[0]) return;
          port = handover.ports[0];
          let queue = Promise.resolve();
          port.onmessage = (message) => (queue = queue.then(() => receive(message)));
        });
      })();
    </script>
  </head>
  <body>
    <!--
      Draws one plugin's own panel inside an opaque origin. The plugin writes
      whatever HTML, CSS and JavaScript it likes and PrintGuard renders none of
      it, so the policy above is what holds it: it may paint and script itself,
      it may show the pictures and video it shipped, and it can reach nothing.

      The script above is allowed by its hash. The plugin's own inline scripts
      are turned into blobs as it is drawn, which the policy allows, so no
      script can load from an address, so a remote <script src>, a script element
      the plugin makes for one and import() of one are all refused.
      Nothing else inline runs, so an onclick attribute is refused, and a frame
      the plugin makes for itself inherits this policy and can run only this
      same script. That is what makes deleting a global stick: there is no fresh
      window to take it back from. Change a character of the script and the hash
      in the policy has to change with it, which the browser console prints.

      WebRTC is the reason. No policy directive governs it in any engine yet,
      so removing its constructors is the only thing that closes it.

      There is no network of its own here, so `pg` is the only way out and every
      call on it is checked against the granted permissions on the other side.
      That is the same `ctx` a node-tree plugin gets, over a different pipe: a
      message port PrintGuard hands over once. A page that replaced this one
      would hold no port, and the dashboard removes the frame the moment it
      loads anything a second time.

      Audio and video from blobs play only for a plugin granted `sound`. A policy
      can only be tightened once it is set, so the page starts open and the script
      closes it as it starts.

      Assets arrive as blobs rather than as base64 or a URL: a blob made here
      belongs to this origin, so the plugin can point an <img> or a <video> at
      one, and nothing outside can follow it.

      The panel is as tall as it draws itself, which it reports back rather than
      being given, and its background is transparent so it sits on the panel the
      dashboard drew around it.
    -->
  </body>
</html>
