<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-/RrjVy+kw5F0QPye+fQCR4aMFlS2ymYQP/4/Z7IU4LI=' 'strict-dynamic' 'unsafe-eval'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob: data:; font-src data:; connect-src 'none'; frame-src 'none'; child-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>PrintGuard plugin panel</title>
    <style>
      html,
      body {
        background: transparent;
        margin: 0;
      }
    </style>
    <script>
      (function () {
        "use strict";

        const closed = ["fetch", "fetchLater", "XMLHttpRequest", "WebSocket", "WebSocketStream", "WebTransport", "EventSource", "Worker", "SharedWorker", "indexedDB", "caches"];
        for (const name of [...closed, ...Object.getOwnPropertyNames(window).filter((name) => name.includes("RTC"))]) {
          try {
            delete window[name];
          } catch {
            /* frozen on some engines; the policy above is what actually closes all but WebRTC */
          }
        }

        const listeners = new Map();
        const assets = new Map();
        let effects = [];
        let store = {};
        let port = null;

        const flush = () => {
          if (effects.length) port.postMessage({ t: "effects", effects: effects.splice(0) });
        };

        const push = (effect) => {
          effects.push(effect);
          queueMicrotask(flush);
        };

        const pg = {
          state: {},
          theme: {},
          get store() {
            return store;
          },
          set store(value) {
            store = value;
            port.postMessage({ t: "store", store });
          },
          on(name, handler) {
            listeners.set(String(name), handler);
          },
          asset(name) {
            return assets.get(String(name)) ?? "";
          },
          command(cmd) {
            push({ kind: "command", cmd });
          },
          http(request) {
            push({ kind: "http", request });
          },
          socket(request) {
            push({ kind: "socket", action: "open", request });
          },
          socketSend(tag, text) {
            push({ kind: "socket", action: "send", request: { tag, text: String(text) } });
          },
          socketClose(tag) {
            push({ kind: "socket", action: "close", request: { tag } });
          },
          call(request) {
            push({ kind: "link", action: "call", request });
          },
          publish(request) {
            push({ kind: "link", action: "publish", request });
          },
          notify(text) {
            push({ kind: "notify", text: String(text) });
          },
          sound(sound) {
            push(typeof sound === "string" ? { kind: "sound", asset: sound } : { kind: "sound", tones: Array.isArray(sound) ? sound : [sound] });
          },
          background(image) {
            push({ kind: "background", image: String(image) });
          },
          log(text) {
            push({ kind: "log", text: String(text) });
          },
        };
        window.pg = pg;

        function paint(html) {
          const parsed = new DOMParser().parseFromString(html, "text/html");
          for (const style of parsed.head.querySelectorAll("style, link")) document.head.appendChild(style);
          for (const node of [...parsed.body.childNodes]) {
            if (node.nodeName !== "SCRIPT") {
              document.body.appendChild(node);
              continue;
            }
            const script = document.createElement("script");
            script.textContent = node.textContent;
            document.body.appendChild(script);
          }
        }

        let themed = null;

        function applyTheme(tokens) {
          if (!tokens || !Object.keys(tokens).length) return;
          pg.theme = tokens;
          if (!themed) {
            themed = document.createElement("style");
            document.head.insertBefore(themed, document.head.firstChild);
          }
          const vars = Object.entries(tokens).map(([k, v]) => `${k}:${v}`).join(";");
          themed.textContent = `:root{${vars};color-scheme:${tokens["color-scheme"] || "dark"}}`;
        }

        function reportHeight() {
          let last = 0;
          new ResizeObserver(() => {
            const height = Math.ceil(document.documentElement.scrollHeight);
            if (height === last) return;
            last = height;
            port.postMessage({ t: "size", height });
          }).observe(document.documentElement);
        }

        function receive(message) {
          const data = message.data || {};
          try {
            if (data.t === "init") {
              store = data.store || {};
              pg.state = data.state || {};
              applyTheme(data.theme);
              for (const [name, blob] of Object.entries(data.assets || {})) assets.set(name, URL.createObjectURL(blob));
              paint(String(data.html || ""));
              reportHeight();
              listeners.get("ready")?.(pg.state);
            } else if (data.t === "state") {
              pg.state = data.state || {};
              if (data.store) store = data.store;
              applyTheme(data.theme);
              listeners.get("state")?.(pg.state);
            } else if (data.t === "event") {
              listeners.get(String(data.event.event))?.(data.event);
            }
          } catch (err) {
            port.postMessage({ t: "failed", message: String((err && err.message) || err) });
          }
        }

        addEventListener("message", (handover) => {
          if (handover.source !== parent || port || !handover.ports[0]) return;
          port = handover.ports[0];
          port.onmessage = receive;
        });
      })();
    </script>
  </head>
  <body>
    <!--
      Draws one plugin's own panel inside an opaque origin. The plugin writes
      whatever HTML, CSS and JavaScript it likes and PrintGuard renders none of
      it, so the policy above is what holds it: it may paint and script itself,
      it may show the pictures and video it shipped, and it can reach nothing.

      The script above is allowed by its hash, and 'strict-dynamic' lets it add
      the plugin's own scripts as elements. Nothing else inline runs, so an
      onclick attribute is refused, and a frame the plugin makes for itself
      inherits this policy and can run only this same script. That is what makes
      deleting a global stick: there is no fresh window to take it back from.
      Change a character of the script and the hash in the policy has to change
      with it, which the browser console prints.

      WebRTC is the reason. No policy directive governs it in any engine yet,
      so removing its constructors is the only thing that closes it.

      There is no network of its own here, so `pg` is the only way out and every
      call on it is checked against the granted permissions on the other side.
      That is the same `ctx` a node-tree plugin gets, over a different pipe: a
      message port PrintGuard hands over once. A page that replaced this one
      would hold no port, and the dashboard removes the frame the moment it
      loads anything a second time.

      Assets arrive as blobs rather than as base64 or a URL: a blob made here
      belongs to this origin, so the plugin can point an <img> or a <video> at
      one, and nothing outside can follow it.

      The panel is as tall as it draws itself, which it reports back rather than
      being given, and its background is transparent so it sits on the panel the
      dashboard drew around it.
    -->
  </body>
</html>
