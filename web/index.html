<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#090908" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self'" />
    <title>PrintGuard</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23090908'/%3E%3Cpath d='M8 5h16v6H8z M10 11h12l-4 7h-4z M14 18h4v3h-4z' fill='%23ff5a14'/%3E%3Crect x='7' y='25' width='18' height='3' fill='%23f2f2ec'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem("pg.theme") || "null");
          var explicit = c && c.id !== "system" && c.base;
          var base = explicit ? c.base : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = base;
          root.style.colorScheme = base;
          if (c && c.glass) root.setAttribute("data-glass", "");
          if (c && c.vars)
            for (var k in c.vars)
              if (Object.prototype.hasOwnProperty.call(c.vars, k) && k.indexOf("--") === 0) root.style.setProperty(k, c.vars[k]);
          var bg = explicit && c.bg ? c.bg : base === "dark" ? "#090908" : "#f6f5f0";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", bg);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
