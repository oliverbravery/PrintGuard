<!--
  The whole plugin. It draws nothing of its own: pg.view hands the dashboard an
  item, which PrintGuard draws as a row like a monitor's, with the cover where a
  camera's frame would be, the track beside it and the transport at the end.
  A press on one of those buttons comes back here as an action event.

  There is no network in here. Every request goes out through pg.http, which
  PrintGuard makes on the plugin's behalf against the addresses the manifest
  declared, and the answer arrives on an http event carrying the tag it was
  named with. {{secret.oauth}} is the access token PrintGuard holds from the
  sign-in, filled in as the request leaves, so this file never sees one.
-->
<script>
  const PLAYER = "https://api.spotify.com/v1/me/player";
  const POLL_MS = 5000;
  const PREMIUM_NOTE = "Playback controls need Spotify Premium.";

  const shown = { title: "Not connected", description: "Connect Spotify in the Plugins tab in Settings.", image: "" };
  const state = { playing: false, cover: "", premium: true };

  // Whether the transport buttons do anything. Spotify answers 403 on a free
  // account whatever scopes were granted, so the row says so once it knows
  // rather than leaving three buttons that quietly fail.
  const signedIn = () => pg.secrets.includes("oauth");

  // The row is redrawn whole every time anything on it changes.
  const draw = () => {
    const live = state.premium && signedIn() && !rejected;
    pg.view({
      type: "item",
      image: shown.image,
      title: shown.title,
      description: state.premium ? shown.description : PREMIUM_NOTE,
      actions: [
        { type: "button", icon: "previous", label: "Previous", action: "previous", disabled: !live },
        { type: "button", icon: state.playing ? "pause" : "play", label: state.playing ? "Pause" : "Play", action: "toggle", disabled: !live },
        { type: "button", icon: "next", label: "Next", action: "next", disabled: !live },
      ],
    });
  };

  const poll = () => pg.http({ url: PLAYER, headers: { Authorization: "Bearer {{secret.oauth}}" }, tag: "player" });

  // The player is polled rather than pushed, so a press flips the button now and
  // the next poll is what settles it. Waiting for the poll would leave it
  // looking dead for as long as five seconds.
  const send = (request) => {
    pg.http({ ...request, headers: { Authorization: "Bearer {{secret.oauth}}" }, tag: "control" });
    setTimeout(poll, 400);
  };

  pg.on("action", ({ name }) => {
    if (name === "toggle") {
      state.playing = !state.playing;
      draw();
      send({ method: "PUT", url: `${PLAYER}/${state.playing ? "play" : "pause"}` });
    } else if (name === "previous") send({ method: "POST", url: `${PLAYER}/previous` });
    else if (name === "next") send({ method: "POST", url: `${PLAYER}/next` });
  });

  const playing = (item, isPlaying) => {
    state.playing = isPlaying;
    shown.title = item.name;
    shown.description = (item.artists || []).map((artist) => artist.name).join(", ");
    // The panel may show pictures it was handed but may not fetch one, so the
    // cover comes back through pg.http as bytes and becomes a data URL here.
    const art = (item.album.images || [])[0];
    if (art && art.url !== state.cover) {
      state.cover = art.url;
      pg.http({ url: art.url, binary: true, tag: "cover" });
    }
    draw();
  };

  const idle = (message, title = "Nothing playing") => {
    state.cover = "";
    shown.image = "";
    shown.title = title;
    shown.description = message;
    draw();
    pg.background("");
  };

  pg.on("http", (event) => {
    if (event.tag === "control") {
      state.premium = event.status !== 403;
      draw();
    } else if (event.tag === "cover") {
      shown.image = `data:image/jpeg;base64,${event.body}`;
      draw();
      pg.background(shown.image);
    } else if (event.tag === "player") {
      if (event.status === 401) reject();
      else if (event.status === 204 || !event.body || !event.body.item) idle("Start something on any of your devices.");
      else playing(event.body.item, event.body.is_playing === true);
    }
  });

  // Until a client id is saved and Connect is finished every request would be
  // refused, so the panel only polls while PrintGuard holds a token for it.
  let polling = null;
  let rejected = false;

  const stopPolling = () => {
    clearInterval(polling);
    polling = null;
  };

  // A token Spotify turns down stays turned down, so the panel stops asking
  // until the sign-in is disconnected and made again.
  const reject = () => {
    rejected = true;
    stopPolling();
    idle("Disconnect, then Connect again in Settings.", "Sign-in rejected");
  };

  const sync = () => {
    if (signedIn() && !rejected && polling === null) {
      poll();
      polling = setInterval(poll, POLL_MS);
      draw();
    } else if (!signedIn() && (polling !== null || rejected)) {
      rejected = false;
      stopPolling();
      idle("Connect Spotify in the Plugins tab in Settings.", "Not connected");
    }
  };

  // Watching the sign-in on a timer, since pg.on("state") would need the
  // state:read permission that nothing else here has a use for.
  pg.on("ready", () => {
    draw();
    sync();
    setInterval(sync, 1000);
  });
</script>
