name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: uv run pytest
      - run: npm run typecheck --prefix web
      - id: playwright
        run: echo "version=$(node -p 'require("./web/node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install chromium and webkit, or only their system libraries when the browsers came from the cache
        working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:sandbox --prefix web
      - run: npm ci --prefix feedback-worker
      - run: npm run typecheck --prefix feedback-worker
      - run: npm test --prefix feedback-worker

  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: uv audit --locked --preview-features audit
      - run: npm audit --prefix web
      - run: npm audit --prefix feedback-worker

  image:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: standard
            suffix: ""
            extra: ""
            gpu_runtime_debs: ""
            gpu_runtime_debs_sha256: ""
            gpu_visible_devices: ""
          - name: Intel
            suffix: -intel
            extra: ""
            gpu_runtime_debs: >-
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-core-2_2.38.2+22051_amd64.deb
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-opencl-2_2.38.2+22051_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/libigdgmm12_22.10.0_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/intel-opencl-icd_26.27.39122.11-0_amd64.deb
            gpu_runtime_debs_sha256: >-
              3dbcbe4e716d62e9bd43a4a476d724cf772b4581dbcdd096d70df382e7ccad7e
              e265d191590efd5491bfbbd148c144fdd40aea51e0b57f8651130d2da20b8186
              6031a63d6e8a12ce61c14efc15f2c8e727061286e3820b8594e6d00615e04d54
              6e447a783c99fb5634df298c135a81165be07db98672df96cdf413d22f3e6ac4
            gpu_visible_devices: ""
          - name: NVIDIA
            suffix: -nvidia
            extra: --extra nvidia
            gpu_runtime_debs: ""
            gpu_runtime_debs_sha256: ""
            gpu_visible_devices: all
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          build-args: |
            VARIANT=${{ matrix.suffix }}
            INFERENCE_EXTRA=${{ matrix.extra }}
            GPU_RUNTIME_DEBS=${{ matrix.gpu_runtime_debs }}
            GPU_RUNTIME_DEBS_SHA256=${{ matrix.gpu_runtime_debs_sha256 }}
            NVIDIA_VISIBLE_DEVICES=${{ matrix.gpu_visible_devices }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  image-gate:
    name: image
    needs: image
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every image variant must have built, under a name branch protection can require
        env:
          RESULT: ${{ needs.image.result }}
        run: '[ "$RESULT" = "success" ]'

  launch:
    name: launch (${{ matrix.name }})
    if: github.base_ref == 'main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: container
            os: ubuntu-24.04
            project: launch
            camera_host: host.docker.internal
          - name: macOS
            os: macos-14
            project: launch-webkit
          - name: Windows
            os: windows-latest
            project: launch
            app_window: http://127.0.0.1:9222
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: matrix.name == 'container'
      - name: Build the standard image
        if: matrix.name == 'container'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: ghcr.io/oliverbravery/printguard:latest
          cache-from: type=gha,scope=standard
      - name: Start it from the compose file and wait until it reports healthy
        if: matrix.name == 'container'
        run: docker compose up --no-build --wait --wait-timeout 300
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: matrix.name != 'container'
        with:
          version: "0.11.32"
      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        if: matrix.name == 'macOS'
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build the desktop app
        if: matrix.name != 'container'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash packaging/build.sh
      - name: Install the app from the disk image and open it
        if: matrix.name == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/PrintGuard-macos-arm64.dmg
          cp -R "$RUNNER_TEMP/dmg/PrintGuard.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/dmg"
          open --env LOG_FILE="$RUNNER_TEMP/printguard.log" /Applications/PrintGuard.app
      - name: Unzip the app as Explorer would a download and open it with its window open to Playwright
        if: matrix.name == 'Windows'
        shell: pwsh
        env:
          LOG_FILE: ${{ runner.temp }}\printguard.log
          PRINTGUARD_DEBUG_PORT: "9222"
        run: |
          Expand-Archive dist\PrintGuard-windows-x64.zip -DestinationPath $env:RUNNER_TEMP
          Get-ChildItem "$env:RUNNER_TEMP\PrintGuard" -Recurse -File -Exclude PrintGuard.exe | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3"
          }
          Start-Process "$env:RUNNER_TEMP\PrintGuard\PrintGuard.exe" -WorkingDirectory "$env:RUNNER_TEMP\PrintGuard"
      - name: Install the dashboard's dependencies
        if: matrix.name == 'container'
        working-directory: web
        run: npm ci
      - name: Install WebKit
        if: matrix.name == 'macOS'
        working-directory: web
        run: npx playwright install webkit
      - name: Register cameras and monitors, and catch a failing print
        working-directory: web
        env:
          PRINTGUARD_URL: http://localhost:8000
          PRINTGUARD_CAMERA_HOST: ${{ matrix.camera_host }}
          PRINTGUARD_CDP: ${{ matrix.app_window }}
          PRINTGUARD_LOG: ${{ matrix.name != 'container' && format('{0}/printguard.log', runner.temp) || '' }}
        run: npx playwright test --project=${{ matrix.project }}
      - name: Keep the container log
        if: always() && matrix.name == 'container'
        run: docker compose logs --no-color > "$RUNNER_TEMP/printguard.log"
      - name: Screenshot the desktop
        if: always() && matrix.name == 'macOS'
        run: screencapture -x "$RUNNER_TEMP/desktop.png"
      - name: Screenshot the desktop
        if: always() && matrix.name == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $image.Save("$env:RUNNER_TEMP\desktop.png")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: launch-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            web/test-results
            ${{ runner.temp }}/printguard.log
            ${{ runner.temp }}/desktop.png

  launch-gate:
    name: launch
    needs: launch
    if: always() && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: The container and both desktop apps must start and catch a failing print, under a name branch protection can require
        env:
          RESULT: ${{ needs.launch.result }}
        run: '[ "$RESULT" = "success" ]'

  version:
    name: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The version must be bumped past the last release and documented in the changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error file=pyproject.toml::v${version} is already released, run 'uv version --bump patch|minor|major'"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [${version}]' section, describe the change in CHANGELOG.md, which becomes the release notes"
            exit 1
          fi
          if [ "${BASE_REF}" = "main" ]; then
            today=$(TZ=Europe/London date +%F)
            dated=$(grep -m1 "^## \[${version}\]" CHANGELOG.md | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            if [ "${dated}" != "${today}" ]; then
              echo "::error file=CHANGELOG.md::'## [${version}]' is dated '${dated}' but today is ${today} in London, a release carries the date it merges"
              exit 1
            fi
          fi
          echo "v${version} is unreleased and documented"
