name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: uv sync --locked
      - run: uv run pytest
      - name: Run the tests again on the Python the image ships
        run: uv run --isolated --locked --python 3.13 pytest
      - run: npm run typecheck --prefix web
      - run: npm run site:build --prefix web
      - id: playwright
        run: echo "version=$(node -p 'require("./web/node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install chromium and webkit, or only their system libraries when the browsers came from the cache
        working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:sandbox --prefix web
      - run: npm ci --prefix feedback-worker
      - run: npm run typecheck --prefix feedback-worker
      - run: npm test --prefix feedback-worker

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - run: uv audit --locked --preview-features audit
      - run: npm audit --prefix web
      - run: npm audit --prefix feedback-worker

  image:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - name: standard
            suffix: ""
            extra: ""
            gpu_runtime_debs: ""
            gpu_runtime_debs_sha256: ""
            gpu_visible_devices: ""
          - name: Intel
            suffix: -intel
            extra: ""
            gpu_runtime_debs: >-
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-core-2_2.38.2+22051_amd64.deb
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-opencl-2_2.38.2+22051_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/libigdgmm12_22.10.0_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/intel-opencl-icd_26.27.39122.11-0_amd64.deb
            gpu_runtime_debs_sha256: >-
              3dbcbe4e716d62e9bd43a4a476d724cf772b4581dbcdd096d70df382e7ccad7e
              e265d191590efd5491bfbbd148c144fdd40aea51e0b57f8651130d2da20b8186
              6031a63d6e8a12ce61c14efc15f2c8e727061286e3820b8594e6d00615e04d54
              6e447a783c99fb5634df298c135a81165be07db98672df96cdf413d22f3e6ac4
            gpu_visible_devices: ""
          - name: NVIDIA
            suffix: -nvidia
            extra: --extra nvidia
            gpu_runtime_debs: ""
            gpu_runtime_debs_sha256: ""
            gpu_visible_devices: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.name == 'standard' && github.base_ref == 'main'
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.name == 'standard' && github.base_ref == 'main' && 'linux/amd64,linux/arm64' || '' }}
          push: false
          build-args: |
            VARIANT=${{ matrix.suffix }}
            INFERENCE_EXTRA=${{ matrix.extra }}
            GPU_RUNTIME_DEBS=${{ matrix.gpu_runtime_debs }}
            GPU_RUNTIME_DEBS_SHA256=${{ matrix.gpu_runtime_debs_sha256 }}
            NVIDIA_VISIBLE_DEVICES=${{ matrix.gpu_visible_devices }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  image-gate:
    name: image
    needs: image
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every image variant must have built, under a name branch protection can require
        env:
          RESULT: ${{ needs.image.result }}
        run: '[ "$RESULT" = "success" ]'

  launch:
    name: launch (${{ matrix.name }})
    if: github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: container
            os: ubuntu-24.04
            project: launch
            camera_host: host.docker.internal
          - name: macOS
            os: macos-14
            project: launch-webkit
          - name: Windows
            os: windows-2025
            project: launch
            app_window: http://127.0.0.1:9222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.name == 'container'
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build the standard image
        if: matrix.name == 'container'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/oliverbravery/printguard:latest
          cache-from: type=gha,scope=standard
      - name: Start it from the compose file and wait until it reports healthy
        if: matrix.name == 'container'
        run: docker compose up --no-build --wait --wait-timeout 300
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.name != 'container'
        with:
          version: "0.11.32"
      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        if: matrix.name == 'macOS'
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build the desktop app
        if: matrix.name != 'container'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: Developer ID Application
        run: bash packaging/build.sh
      - name: Notarise the disk image, the only step handed the notarisation key
        if: matrix.name == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash packaging/notarise.sh dist/PrintGuard-macos-arm64.dmg
      - name: Install the app from the disk image and open it
        if: matrix.name == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/PrintGuard-macos-arm64.dmg
          cp -R "$RUNNER_TEMP/dmg/PrintGuard.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/dmg"
          open --env LOG_FILE="$RUNNER_TEMP/printguard.log" /Applications/PrintGuard.app
      - name: Unzip the app as Explorer would a download and open it with its window open to Playwright
        if: matrix.name == 'Windows'
        shell: pwsh
        env:
          LOG_FILE: ${{ runner.temp }}\printguard.log
          PRINTGUARD_DEBUG_PORT: "9222"
        run: |
          Expand-Archive dist\PrintGuard-windows-x64.zip -DestinationPath $env:RUNNER_TEMP
          Get-ChildItem "$env:RUNNER_TEMP\PrintGuard" -Recurse -File -Exclude PrintGuard.exe | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3"
          }
          Start-Process "$env:RUNNER_TEMP\PrintGuard\PrintGuard.exe" -WorkingDirectory "$env:RUNNER_TEMP\PrintGuard"
      - name: Install the dashboard's dependencies
        if: matrix.name == 'container'
        working-directory: web
        run: npm ci
      - name: Install WebKit
        if: matrix.name == 'macOS'
        working-directory: web
        run: npx playwright install webkit
      - name: Register cameras and monitors, and catch a failing print
        working-directory: web
        env:
          PRINTGUARD_URL: http://localhost:8000
          PRINTGUARD_CAMERA_HOST: ${{ matrix.camera_host }}
          PRINTGUARD_CDP: ${{ matrix.app_window }}
          PRINTGUARD_LOG: ${{ matrix.name != 'container' && format('{0}/printguard.log', runner.temp) || '' }}
        run: npx playwright test --project=${{ matrix.project }}
      - name: Keep the container log
        if: always() && matrix.name == 'container'
        run: docker compose logs --no-color > "$RUNNER_TEMP/printguard.log"
      - name: Screenshot the desktop
        if: always() && matrix.name == 'macOS'
        run: screencapture -x "$RUNNER_TEMP/desktop.png"
      - name: Screenshot the desktop
        if: always() && matrix.name == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $image.Save("$env:RUNNER_TEMP\desktop.png")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: launch-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            web/test-results
            ${{ runner.temp }}/printguard.log
            ${{ runner.temp }}/desktop.png

  launch-gate:
    name: launch
    needs: launch
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      checks: read
      contents: read
    steps:
      - name: Into main, the container and both desktop apps must have started and caught a failing print, a skipped launch fails, and a title or body edit takes the result already on this commit, under a name branch protection can require
        env:
          BASE_REF: ${{ github.base_ref }}
          RESULT: ${{ needs.launch.result }}
          EDITED_ONLY: ${{ github.event.action == 'edited' && !github.event.changes.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$BASE_REF" != main ] && exit 0
          [ "$RESULT" = success ] && exit 0
          [ "$RESULT" = skipped ] && [ "$EDITED_ONLY" = true ] || exit 1
          while :; do
            latest=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | select((.name | startswith("launch (")) and .conclusion != "skipped") | {name, status, conclusion, started_at}' \
              | jq -s 'group_by(.name) | map(sort_by(.started_at) | last)')
            jq -e 'length == 3 and all(.status == "completed")' <<< "$latest" > /dev/null && break
            sleep 60
          done
          jq -e 'all(.conclusion == "success")' <<< "$latest" > /dev/null

  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The version must be bumped past the last release and documented in the changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error file=pyproject.toml::v${version} is already released, run 'uv version --bump patch|minor|major'"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [${version}]' section, describe the change in CHANGELOG.md, which becomes the release notes"
            exit 1
          fi
          if [ "${BASE_REF}" = "main" ]; then
            today=$(TZ=Europe/London date +%F)
            dated=$(grep -m1 "^## \[${version}\]" CHANGELOG.md | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            if [ "${dated}" != "${today}" ]; then
              echo "::error file=CHANGELOG.md::'## [${version}]' is dated '${dated}' but today is ${today} in London, a release carries the date it merges"
              exit 1
            fi
          fi
          echo "v${version} is unreleased and documented"
      - name: The image and the desktop apps must bundle the same MediaMTX, and the image must build with the uv the workflows pin
        run: |
          image_mediamtx=$(sed -n 's|^FROM bluenviron/mediamtx:\([0-9.]*\)@.*|\1|p' Dockerfile)
          desktop_mediamtx=$(sed -n 's|^MEDIAMTX_VERSION=||p' packaging/build.sh)
          if [ -z "${image_mediamtx}" ] || [ "${image_mediamtx}" != "${desktop_mediamtx}" ]; then
            echo "::error file=packaging/build.sh::the Dockerfile bundles MediaMTX '${image_mediamtx}' and packaging/build.sh '${desktop_mediamtx}', move MEDIAMTX_VERSION and its checksums to match"
            exit 1
          fi
          image_uv=$(sed -n 's|.*ghcr.io/astral-sh/uv:\([0-9.]*\)@.*|\1|p' Dockerfile)
          workflow_uv=$(grep -rhoE 'version: "[0-9.]+"' .github/workflows | sort -u)
          if [ -z "${image_uv}" ] || [ "${workflow_uv}" != "version: \"${image_uv}\"" ]; then
            echo "::error file=Dockerfile::the Dockerfile builds with uv '${image_uv}' and the workflows pin '${workflow_uv}', move setup-uv's version in every workflow to match"
            exit 1
          fi
