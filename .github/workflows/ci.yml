name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: uv run pytest

  image:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: standard
            suffix: ""
            extra: ""
            gpu_runtime_debs: ""
            gpu_visible_devices: ""
          - name: Intel
            suffix: -intel
            extra: ""
            gpu_runtime_debs: >-
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-core-2_2.38.2+22051_amd64.deb
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-opencl-2_2.38.2+22051_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/libigdgmm12_22.10.0_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/intel-opencl-icd_26.27.39122.11-0_amd64.deb
            gpu_visible_devices: ""
          - name: NVIDIA
            suffix: -nvidia
            extra: --extra nvidia
            gpu_runtime_debs: ""
            gpu_visible_devices: all
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VARIANT=${{ matrix.suffix }}
            INFERENCE_EXTRA=${{ matrix.extra }}
            GPU_RUNTIME_DEBS=${{ matrix.gpu_runtime_debs }}
            NVIDIA_VISIBLE_DEVICES=${{ matrix.gpu_visible_devices }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  image-gate:
    name: image
    needs: image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every image variant must have built, under a name branch protection can require
        run: '[ "${{ needs.image.result }}" = "success" ]'

  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The version must be bumped past the last release and documented in the changelog
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error file=pyproject.toml::v${version} is already released — run 'uv version --bump patch|minor|major'"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [${version}]' section — describe the change in CHANGELOG.md; it becomes the release notes"
            exit 1
          fi
          echo "v${version} is unreleased and documented"
