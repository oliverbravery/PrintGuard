name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Refuse to re-release an existing version
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.read.outputs.version }}" >/dev/null; then
            echo "::error file=pyproject.toml::v${{ steps.read.outputs.version }} is already released, run 'uv version --bump patch|minor|major'"
            exit 1
          fi
      - name: Refuse to release an undocumented version
        run: |
          if ! grep -q "^## \[${{ steps.read.outputs.version }}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [${{ steps.read.outputs.version }}]' section, describe the change in CHANGELOG.md; it becomes the release notes"
            exit 1
          fi

  docker:
    name: image (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: standard
            platforms: linux/amd64,linux/arm64
            suffix: ""
            extra: ""
            gpu_runtime_debs: ""
            gpu_visible_devices: ""
          - name: Intel
            platforms: linux/amd64
            suffix: -intel
            extra: ""
            gpu_runtime_debs: >-
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-core-2_2.38.2+22051_amd64.deb
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-opencl-2_2.38.2+22051_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/libigdgmm12_22.10.0_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/intel-opencl-icd_26.27.39122.11-0_amd64.deb
            gpu_visible_devices: ""
          - name: NVIDIA
            platforms: linux/amd64
            suffix: -nvidia
            extra: --extra nvidia
            gpu_runtime_debs: ""
            gpu_visible_devices: all
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/printguard
          tags: |
            type=semver,pattern={{version}}${{ matrix.suffix }},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.suffix }},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest${{ matrix.suffix }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.suffix }}
            INFERENCE_EXTRA=${{ matrix.extra }}
            GPU_RUNTIME_DEBS=${{ matrix.gpu_runtime_debs }}
            NVIDIA_VISIBLE_DEVICES=${{ matrix.gpu_visible_devices }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: tag
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog section as the release notes
        run: |
          awk -v ver="${{ needs.version.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" {hit=1; next}
            hit && (/^## \[/ || /^\[[^]]+\]: /) {exit}
            hit {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - run: gh release create "v${{ needs.version.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ needs.version.outputs.version }}" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    name: desktop
    needs: [version, release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the desktop app
        shell: bash
        run: bash packaging/build.sh
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.version.outputs.version }}" dist/PrintGuard-* --clobber

  pages:
    name: pages
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bundle engine source and model for the static demo
        run: |
          python3 printguard/pysrc.py web/public/pysrc.zip
          cp -r models web/public/models
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  follow-up:
    name: reporter follow-up
    needs: [version, docker, release, desktop, pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Ask related reporters to verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          pr_number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq 'map(select(.merged_at != null))[0].number // empty')
          if [ -z "$pr_number" ]; then
            exit 0
          fi
          issue_numbers=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
          for issue_number in $issue_numbers; do
            marker="<!-- release-follow-up:${VERSION} -->"
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" --jq '.[].body' | grep -Fq "$marker"; then
              continue
            fi
            released="${VERSION} is released and carries the change for this issue. Update to it when you can, then let me know how it goes: the [release page](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}) has the notes and the desktop builds."
            verify="If it resolves this, please close the issue. If it does not, leave it open and comment with what is still happening. With no reply it closes automatically after 30 days, and you can reopen it at any point."
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "${marker}"$'\n\n'"${released}"$'\n\n'"${verify}"
          done
