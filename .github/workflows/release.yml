name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: read
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Refuse to re-release an existing version
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error file=pyproject.toml::v${VERSION} is already released, run 'uv version --bump patch|minor|major'"
            exit 1
          fi
      - name: Refuse to release an undocumented version
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [${VERSION}]' section, describe the change in CHANGELOG.md, which becomes the release notes"
            exit 1
          fi
      - name: Refuse to release a changelog dated any day but the one it merged, London time
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          merged=$(TZ=Europe/London date -d "$(git log -1 --format=%cI)" +%F)
          dated=$(grep -m1 "^## \[${VERSION}\]" CHANGELOG.md | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          if [ "${dated}" != "${merged}" ]; then
            echo "::error file=CHANGELOG.md::'## [${VERSION}]' is dated '${dated}' but it merged on ${merged} in London, correct the date and merge again"
            exit 1
          fi

  docker:
    name: image (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: standard
            platforms: linux/amd64,linux/arm64
            suffix: ""
            extra: ""
            gpu_runtime_debs: ""
            gpu_runtime_debs_sha256: ""
            gpu_visible_devices: ""
          - name: Intel
            platforms: linux/amd64
            suffix: -intel
            extra: ""
            gpu_runtime_debs: >-
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-core-2_2.38.2+22051_amd64.deb
              https://github.com/intel/intel-graphics-compiler/releases/download/v2.38.2/intel-igc-opencl-2_2.38.2+22051_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/libigdgmm12_22.10.0_amd64.deb
              https://github.com/intel/compute-runtime/releases/download/26.27.39122.11/intel-opencl-icd_26.27.39122.11-0_amd64.deb
            gpu_runtime_debs_sha256: >-
              3dbcbe4e716d62e9bd43a4a476d724cf772b4581dbcdd096d70df382e7ccad7e
              e265d191590efd5491bfbbd148c144fdd40aea51e0b57f8651130d2da20b8186
              6031a63d6e8a12ce61c14efc15f2c8e727061286e3820b8594e6d00615e04d54
              6e447a783c99fb5634df298c135a81165be07db98672df96cdf413d22f3e6ac4
            gpu_visible_devices: ""
          - name: NVIDIA
            platforms: linux/amd64
            suffix: -nvidia
            extra: --extra nvidia
            gpu_runtime_debs: ""
            gpu_runtime_debs_sha256: ""
            gpu_visible_devices: all
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/printguard
          tags: |
            type=semver,pattern={{version}}${{ matrix.suffix }},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.suffix }},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest${{ matrix.suffix }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.suffix }}
            INFERENCE_EXTRA=${{ matrix.extra }}
            GPU_RUNTIME_DEBS=${{ matrix.gpu_runtime_debs }}
            GPU_RUNTIME_DEBS_SHA256=${{ matrix.gpu_runtime_debs_sha256 }}
            NVIDIA_VISIBLE_DEVICES=${{ matrix.gpu_visible_devices }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: tag
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Extract this version's changelog section as the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" {hit=1; next}
            hit && (/^## \[/ || /^\[[^]]+\]: /) {exit}
            hit {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - run: gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}

  desktop:
    name: desktop
    needs: [version, release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        if: runner.os == 'macOS'
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build the desktop app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash packaging/build.sh
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v${VERSION}" dist/PrintGuard-* --clobber

  pages:
    name: pages
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run site:build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist-site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  follow-up:
    name: reporter follow-up
    needs: [version, docker, release, desktop, pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Ask related reporters to verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          pr_number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq 'map(select(.merged_at != null))[0].number // empty')
          if [ -z "$pr_number" ]; then
            exit 0
          fi
          issue_numbers=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
          for issue_number in $issue_numbers; do
            marker="<!-- release-follow-up:${VERSION} -->"
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" --jq '.[].body' | grep -Fq "$marker"; then
              continue
            fi
            released="${VERSION} is released and carries the change for this issue. Update to it when you can, then let me know how it goes: the [release page](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}) has the notes and the desktop builds."
            verify="If it resolves this, please close the issue. If it does not, leave it open and comment with what is still happening. With no reply it closes automatically after 30 days, and you can reopen it at any point."
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "${marker}"$'\n\n'"${released}"$'\n\n'"${verify}"
          done
